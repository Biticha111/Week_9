<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Sundanese:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS and JS -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://jsdelivr.net" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Custom stylesheet loaded after Bootstrap to allow overrides -->
    <link href="feedback-styles.css" type="text/css" rel="stylesheet">
</head> <!-- Fixed: Changed second <head> to closing </head> -->

<body class="m-4">
    <!-- Page Header: Cleaned up conflicting padding/margin classes -->
    <div class="bg-info p-5 mb-4 rounded-3 text-center">
        <h1>Please provide feedback. You may do so anonymously</h1>
    </div>

    <div class="row">
        <!-- Left Column: Instructions -->
        <div class="col-md-5">
            <h2>Instructions</h2>
            <!-- Fixed: Properly closed the first <p> tag and lowercased the third <p> tag -->
            <p>As one of our students, your thoughts, feedback, and comments are important to us.</p>
            <p>Please send them using this form.</p>
            <p>If you would like us to follow up with you, include your contact information.</p>
        </div>

        <!-- Right Column: Feedback Form -->
        <div class="col-md-7">
            <form id="feedback-form" method="POST" action="/student-feedback">
                
                <!-- Name Field: Fixed <label> spelling, matching 'for'/'id', and changed type to "text" -->
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" id="name" type="text" name="name">
                </div>

                <!-- Email Field: Fixed <label> spelling and replaced <br> with Bootstrap margin class -->
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" name="email">
                </div>

                <!-- Comments Field: Fixed <label> spelling, matching 'for'/'id', and added space before 'required' -->
                <div class="mb-3">
                    <label class="form-label" for="comments">Comments</label>
                    <textarea class="form-control" id="comments" name="comments" required></textarea>
                </div>

                <!-- Radio Buttons: Removed duplicate Name label and added matching 'id's for accessibility -->
                <div class="mb-3">
                    <p class="mb-2">Are you a current student?</p>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="yes" value="yes" name="isCurrentStudent">
                        <label class="form-check-label" for="yes">Yes</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="no" value="no" name="isCurrentStudent">
                        <label class="form-check-label" for="no">No</label>
                    </div>
                </div>

                <!-- Submit Button: Added base 'btn' class for proper Bootstrap styling -->
                <input class="btn btn-dark" type="submit" value="Submit">

            </form>
        </div>
    </div>
</body>
</html>
